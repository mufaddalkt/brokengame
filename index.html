<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broken Ball Game</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      text-align: center;
    }

    #game {
      width: 600px;
      height: 400px;
      margin: 40px auto;
      border: 2px solid black;
      background: skyblue;
      position: relative;
      overflow: hidden;
    }

    #ball {
      width: 30px;
      height: 30px;
      background: red;
      border-radius: 50%;
      position: absolute;
      left: 50px;
      top: 50px;
    }

    #stats {
      position: absolute;
      top: 12px;
      right: 15px;
      z-index: 2;
      font-size: 18px;
      font-weight: bold;
      text-align: right;
    }

    #game-over {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      color: red;
      font-size: 42px;
      font-weight: bold;
    }

    #restart-button {
      padding: 10px 22px;
      border: 2px solid black;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #restart-button:hover {
      background: #f0f0f0;
    }

    #slider {
      width: 100px;
      height: 15px;
      background: black;
      position: absolute;
      left: 0;
      bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>Broken Ball Game</h1>
  <p>There is a ball. That's basically it.</p>

  <div id="game">
    <div id="ball"></div>
    <div id="slider"></div>
    <div id="stats">
      <div>Score: <span id="score">0</span></div>
      <div>Level: <span id="level">1</span></div>
    </div>
    <div id="game-over">
      <span>Game Over</span>
      <button id="restart-button" type="button">Restart</button>
    </div>
  </div>

  <script>
    const ball = document.getElementById("ball");
    const slider = document.getElementById("slider");
    const gameOverMessage = document.getElementById("game-over");
    const scoreDisplay = document.getElementById("score");
    const levelDisplay = document.getElementById("level");
    const restartButton = document.getElementById("restart-button");

    let ballX = 50;
    let ballY = 50;
    let ballVelocityX = 3;
    let ballVelocityY = 3;
    let sliderX = 0;
    let moveLeft = false;
    let moveRight = false;
    let score = 0;
    let level = 1;
    const maxBallSpeed = 12;
    const ballColors = ["red", "orange", "purple", "green", "deeppink", "blue"];
    let ballColorIndex = 0;
    let audioContext;

    function unlockAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playBounceSound() {
      unlockAudio();

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;

      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(650, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.08);
    }

    document.addEventListener("keydown", (event) => {
      unlockAudio();
      if (event.key === "ArrowLeft") moveLeft = true;
      if (event.key === "ArrowRight") moveRight = true;
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "ArrowLeft") moveLeft = false;
      if (event.key === "ArrowRight") moveRight = false;
    });

    restartButton.addEventListener("click", () => {
      unlockAudio();
      ballX = 285;
      ballY = 50;
      ballVelocityX = 3;
      ballVelocityY = 3;
      sliderX = 250;
      moveLeft = false;
      moveRight = false;
      score = 0;
      level = 1;
      ballColorIndex = 0;

      ball.style.background = ballColors[ballColorIndex];
      ball.style.left = ballX + "px";
      ball.style.top = ballY + "px";
      slider.style.left = sliderX + "px";
      scoreDisplay.textContent = score;
      levelDisplay.textContent = level;
      gameOverMessage.style.display = "none";

      requestAnimationFrame(updateGame);
    });

    function updateGame() {
      if (moveLeft) sliderX -= 5;
      if (moveRight) sliderX += 5;

      if (sliderX < 0) sliderX = 0;
      if (sliderX > 500) sliderX = 500;

      slider.style.left = sliderX + "px";

      ballX += ballVelocityX;
      ballY += ballVelocityY;

      if (ballX <= 0 || ballX >= 570) {
        ballVelocityX *= -1;
      }

      if (ballY <= 0) {
        ballY = 0;
        ballVelocityY *= -1;
      }

      const sliderTop = 365;
      const ballBottom = ballY + 30;

      if (
        ballVelocityY > 0 &&
        ballBottom >= sliderTop &&
        ballBottom <= sliderTop + 15 &&
        ballX + 30 >= sliderX &&
        ballX <= sliderX + 100
      ) {
        ballY = sliderTop - 30;
        ballVelocityY *= -1;
        playBounceSound();

        ballColorIndex = (ballColorIndex + 1) % ballColors.length;
        ball.style.background = ballColors[ballColorIndex];

        score += 1;
        scoreDisplay.textContent = score;

        ballVelocityX *= 1.03;
        ballVelocityY *= 1.03;

        if (score % 5 === 0) {
          level += 1;
          levelDisplay.textContent = level;
          ballVelocityX *= 1.07;
          ballVelocityY *= 1.07;
        }

        ballVelocityX = Math.sign(ballVelocityX) * Math.min(Math.abs(ballVelocityX), maxBallSpeed);
        ballVelocityY = Math.sign(ballVelocityY) * Math.min(Math.abs(ballVelocityY), maxBallSpeed);
      }

      if (ballY > 400) {
        gameOverMessage.style.display = "flex";
        return;
      }

      ball.style.left = ballX + "px";
      ball.style.top = ballY + "px";
      requestAnimationFrame(updateGame);
    }

    updateGame();

    // Intentionally simple and incomplete.
    // Students can gradually improve this game.
  </script>
</body>
</html>
