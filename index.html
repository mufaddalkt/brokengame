<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broken Ball Game</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      text-align: center;
    }

    #game {
      width: 600px;
      height: 400px;
      margin: 40px auto;
      border: 2px solid black;
      position: relative;
      overflow: hidden;
    }

    #ball {
      width: 30px;
      height: 30px;
      background: blue;
      border-radius: 50%;
      position: absolute;
      left: 50px;
      top: 50px;
    }

    #slider {
      width: 100px;
      height: 15px;
      background: black;
      position: absolute;
      left: 0;
      bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>Broken Ball Game</h1>
  <p>There is a ball. That's basically it.</p>

  <div id="game">
    <div id="ball"></div>
    <div id="slider"></div>
  </div>

  <script>
    const ball = document.getElementById("ball");
    const slider = document.getElementById("slider");

    let ballX = 50;
    let ballY = 50;
    let ballVelocityY = 2;
    let sliderX = 0;
    let moveLeft = false;
    let moveRight = false;

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") moveLeft = true;
      if (event.key === "ArrowRight") moveRight = true;
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "ArrowLeft") moveLeft = false;
      if (event.key === "ArrowRight") moveRight = false;
    });

    function updateGame() {
      if (moveLeft) sliderX -= 5;
      if (moveRight) sliderX += 5;

      if (sliderX < 0) sliderX = 0;
      if (sliderX > 500) sliderX = 500;

      slider.style.left = sliderX + "px";

      ballVelocityY += 0.15;
      ballY += ballVelocityY;

      const sliderTop = 365;
      const ballBottom = ballY + 30;

      if (
        ballVelocityY > 0 &&
        ballBottom >= sliderTop &&
        ballBottom <= sliderTop + 15 &&
        ballX + 30 >= sliderX &&
        ballX <= sliderX + 100
      ) {
        ballY = sliderTop - 30;
        ballVelocityY = -7;
      }

      if (ballY > 400) {
        ballY = 50;
        ballVelocityY = 2;
      }

      ball.style.top = ballY + "px";
      requestAnimationFrame(updateGame);
    }

    updateGame();

    // Intentionally simple and incomplete.
    // Students can gradually improve this game.
  </script>
</body>
</html>
